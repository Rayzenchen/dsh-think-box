<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-label="Conversation reasoning box, Plugins-page settings card and the model-route picker all visible together">
  <defs>
    <linearGradient id="pv-bg" x1="0" y1="0" x2="640" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F8FF"/>
      <stop offset="1" stop-color="#EEF0FA"/>
    </linearGradient>
    <linearGradient id="pv-icon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4C6FFF"/>
      <stop offset="1" stop-color="#9B5CF6"/>
    </linearGradient>
    <filter id="pv-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#59618C" flood-opacity="0.16"/>
    </filter>
    <filter id="pv-card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#59618C" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="640" height="420" fill="url(#pv-bg)"/>
  <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#7B8199">DeepSeek Harness · 对话</text>
  <text x="352" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#7B8199">插件页 · 思考框与翻译</text>

  <rect x="24" y="42" width="304" height="344" rx="14" fill="#FFFFFF" stroke="#E5E9F4" filter="url(#pv-card)"/>
  <rect x="44" y="66" width="164" height="28" rx="14" fill="#EDF1FE"/>
  <text x="56" y="84" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#4A5578">解释一下 Raft 的选举过程</text>

  <rect x="44" y="112" width="264" height="28" rx="8" fill="#F7F8FD"/>
  <circle cx="58" cy="126" r="4" fill="#8B5CF6"/>
  <text x="68" y="130" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#5A5F7A">思考</text>
  <text x="292" y="130" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#A6ABC0">⌄</text>

  <rect x="44" y="146" width="264" height="76" rx="9" fill="#F5F2FF" stroke="#DDD3FF"/>
  <text x="56" y="165" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10.5" fill="#6D6688">Raft 把时间切成任意长度的任期，</text>
  <text x="56" y="181" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10.5" fill="#6D6688">每个任期最多一个 leader；候选人</text>
  <text x="56" y="197" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10.5" fill="#9A92B8">先拉票，拿到多数派就当选……</text>
  <text x="56" y="213" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9" fill="#B0A8CC">三行预览 · 点击展开 18 行</text>

  <rect x="44" y="244" width="260" height="8" rx="4" fill="#EEF1F8"/>
  <rect x="44" y="262" width="236" height="8" rx="4" fill="#EEF1F8"/>
  <rect x="44" y="280" width="198" height="8" rx="4" fill="#EEF1F8"/>

  <rect x="352" y="42" width="264" height="344" rx="14" fill="#FFFFFF" stroke="#E5E9F4" filter="url(#pv-card)"/>
  <rect x="368" y="60" width="24" height="24" rx="7" fill="url(#pv-icon)"/>
  <rect x="373" y="67" width="10" height="1.8" rx="0.9" fill="#FFFFFF"/>
  <rect x="373" y="70.6" width="7" height="1.8" rx="0.9" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="373" y="74.2" width="5" height="1.8" rx="0.9" fill="#FFFFFF" fill-opacity="0.6"/>
  <text x="400" y="70" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#30364D">思考框与翻译</text>
  <text x="400" y="84" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9" fill="#8E93A8">3 行思考窗 · 18 行展开 · 翻译 + 模型路由</text>

  <rect x="368" y="100" width="232" height="108" rx="10" fill="#FAFBFE" stroke="#E9EDF7"/>
  <text x="380" y="118" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10" fill="#5A5F7A">启用</text>
  <rect x="558" y="109" width="26" height="14" rx="7" fill="#4C6FFF"/>
  <circle cx="577" cy="116" r="5" fill="#FFFFFF"/>
  <text x="380" y="140" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10" fill="#5A5F7A">自动跟随思考</text>
  <rect x="558" y="131" width="26" height="14" rx="7" fill="#4C6FFF"/>
  <circle cx="577" cy="138" r="5" fill="#FFFFFF"/>
  <line x1="380" y1="154" x2="588" y2="154" stroke="#EEF1F8"/>
  <text x="380" y="172" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10" font-weight="600" fill="#30364D">翻译通道</text>
  <text x="380" y="190" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9" fill="#8E93A8">llm · 模型路由可在下方选择</text>

  <rect x="368" y="216" width="232" height="30" rx="8" fill="#F4F6FC" stroke="#E4E9F5"/>
  <text x="380" y="235" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9.5" fill="#6B7188">模型路由</text>
  <text x="426" y="235" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9" fill="#4A5578">OpenCode Go · Flash · High</text>
  <text x="583" y="235" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10" fill="#A6ABC0">⌄</text>

  <rect x="446" y="296" width="132" height="22" rx="11" fill="#EEF1FE"/>
  <text x="456" y="311" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9" fill="#4C5A8C">设置卡（始终保留）</text>
  <path d="M512 294 L512 252" stroke="#B9C2DE" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="512" cy="252" r="2" fill="#B9C2DE"/>

  <rect x="120" y="252" width="308" height="150" rx="12" fill="#FFFFFF" stroke="#E2E6F2" filter="url(#pv-shadow)"/>
  <text x="134" y="274" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10" fill="#8E93A8">搜索模型…</text>
  <text x="134" y="296" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9" font-weight="600" fill="#8E93A8">OPENCODE GO</text>
  <rect x="128" y="302" width="292" height="24" rx="6" fill="#EEF1FB"/>
  <text x="138" y="318" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10" fill="#30364D">DeepSeek 4.1 Flash</text>
  <text x="396" y="318" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10" fill="#4C6FFF">✓</text>
  <text x="138" y="338" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10" fill="#30364D">DeepSeek 4.1 Flash Eco</text>
  <text x="134" y="360" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9" font-weight="600" fill="#8E93A8">DEEPSEEK API</text>
  <text x="138" y="378" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10" fill="#30364D">deepseek-flash</text>
  <line x1="132" y1="386" x2="416" y2="386" stroke="#EEF1F8"/>
  <text x="134" y="398" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9" fill="#8E93A8">推理强度</text>
  <text x="392" y="398" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9" fill="#4A5578">High ›</text>

  <path d="M430 330 L440 330" stroke="#B9C2DE" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="446" y="333" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9" fill="#7B8199">模型路由选择器</text>
</svg>
